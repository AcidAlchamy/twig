[package]
name = "twig"
version = "1.0.1"
edition = "2024"
description = "Right-click a folder, get its tree: copied, ready to paste into a chat, a README or an issue."
license = "MIT"
repository = "https://github.com/AcidAlchamy/twig"
homepage = "https://acidalchamy.com/donationware/twig/"
authors = ["Acid Alchamy"]
publish = false

[features]
# Draws as if Windows' display scale were TWIG_TEST_SCALE, to check layouts. Never in a release.
scale-test = []

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
eframe = { version = "0.37", default-features = false, features = ["glow"] }
raw-window-handle = "0.6"
rfd = { version = "0.16", default-features = false }
ignore = "0.4"

[dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

# Only for asking File Explorer which folder it shows (COM interfaces).
[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
png = "0.18"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
